<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dsh-sounds 🔊 DeepSeek Harness 提示音</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2130;
    --border: #2a3350;
    --text: #e8ebf2;
    --muted: #8b93a7;
    --accent: #5686fe;
    --green: #3ddc84;
    --red: #ff5f5f;
    --amber: #ffb454;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 64px;
  }
  .wrap { width: 100%; max-width: 680px; }
  header { text-align: center; margin-bottom: 40px; }
  .logo { font-size: 52px; line-height: 1; }
  h1 { font-size: 28px; font-weight: 700; margin: 16px 0 8px; }
  .sub { color: var(--muted); font-size: 15px; line-height: 1.6; }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    display: flex;
    align-items: center;
    gap: 18px;
    transition: transform .15s, border-color .15s;
  }
  .card:hover { transform: translateY(-2px); }
  .icon { font-size: 34px; width: 52px; text-align: center; flex-shrink: 0; }
  .meta { flex: 1; }
  .name { font-size: 17px; font-weight: 600; }
  .desc { color: var(--muted); font-size: 13px; margin-top: 4px; line-height: 1.5; }
  .btn {
    border: 0; border-radius: 10px; padding: 10px 18px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    color: #0f1420; flex-shrink: 0;
    transition: filter .15s, transform .1s;
  }
  .btn:hover { filter: brightness(1.12); }
  .btn:active { transform: scale(.96); }
  .btn-green { background: var(--green); }
  .btn-red { background: var(--red); }
  .btn-amber { background: var(--amber); }
  .btn-all {
    width: 100%; padding: 14px; font-size: 15px;
    background: var(--accent); color: #fff;
  }
  .note {
    margin-top: 24px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.7;
  }
  .note code { background: #232b3d; padding: 2px 6px; border-radius: 5px; font-size: 11px; }
  footer { margin-top: 40px; text-align: center; color: var(--muted); font-size: 12px; }
  footer a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🔊</div>
    <h1>dsh-sounds</h1>
    <p class="sub">DeepSeek Harness 提示音 · 任务完成 / 失败 / 等待批准<br>点击按钮试听 👇</p>
  </header>

  <div class="cards">
    <div class="card">
      <div class="icon">🎉</div>
      <div class="meta">
        <div class="name">任务完成 · 回合完成</div>
        <div class="desc">叮咚叮咚叮咚 — 523 / 659 / 784Hz 上行三连音</div>
      </div>
      <button class="btn btn-green" onclick="play('celebrate')">试听</button>
    </div>

    <div class="card">
      <div class="icon">❌</div>
      <div class="meta">
        <div class="name">任务失败 · 请求出错</div>
        <div class="desc">嘟—— 170Hz 方波警示音</div>
      </div>
      <button class="btn btn-red" onclick="play('error')">试听</button>
    </div>

    <div class="card">
      <div class="icon">⏳</div>
      <div class="meta">
        <div class="name">等待批准 · Agent 提问</div>
        <div class="desc">叮 — 880Hz 轻柔短音</div>
      </div>
      <button class="btn btn-amber" onclick="play('wait')">试听</button>
    </div>

    <button class="btn btn-all" onclick="playAll()">▶ 全部播放</button>
  </div>

  <p class="note">
    声音由 <code>Web Audio</code> 实时合成，无音频文件 · 浏览器首次点击后才会发声（自动播放策略）
  </p>

  <footer>
    <a href="https://github.com/DNNCOVO/dsh-sounds">GitHub 仓库</a> · 插件源码与安装说明见 README
  </footer>
</div>

<script>
  let ctx = null;
  function ac() {
    if (!ctx) {
      const Ctor = window.AudioContext || window.webkitAudioContext;
      if (!Ctor) return null;
      ctx = new Ctor();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function tone(freq, t0, dur, type, gain) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  function play(kind) {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime;
    if (kind === 'celebrate') {
      [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t0 + i * 0.13, 0.38, 'sine', 0.16));
    } else if (kind === 'error') {
      tone(170, t0, 0.5, 'square', 0.1);
    } else if (kind === 'wait') {
      tone(880, t0, 0.25, 'sine', 0.08);
    }
  }
  function playAll() {
    const c = ac(); if (!c) return;
    const t0 = c.currentTime;
    [523.25, 659.25, 783.99].forEach((f, i) => tone(f, t0 + i * 0.13, 0.38, 'sine', 0.16));
    tone(170, t0 + 0.7, 0.5, 'square', 0.1);
    tone(880, t0 + 1.4, 0.25, 'sine', 0.08);
  }
</script>
</body>
</html>
